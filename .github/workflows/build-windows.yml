name: Build Windows

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - cloud-build
      - plugin-engine

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: tdesktop

      - name: Pick build drive
        shell: pwsh
        run: |
          Get-PSDrive -PSProvider FileSystem | ForEach-Object {
            "{0}: free {1:N1} GB" -f $_.Name, ($_.Free/1GB)
          }
          $best = Get-PSDrive -PSProvider FileSystem |
            Where-Object { $_.Free -gt 40GB } |
            Sort-Object Free -Descending |
            Select-Object -First 1
          if (-not $best) {
            $best = Get-PSDrive -PSProvider FileSystem |
              Sort-Object Free -Descending | Select-Object -First 1
          }
          $root = "$($best.Name):\tbuild"
          New-Item -ItemType Directory -Force $root | Out-Null
          "BUILD_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "Using $root"

      - name: Patch cmake submodule (MSVC PDB workaround)
        shell: pwsh
        run: |
          $f = "tdesktop\cmake\options_win.cmake"
          $lines = Get-Content $f
          $patched = $false
          $out = foreach ($line in $lines) {
            if (-not $patched -and $line -match "^\s*/MP\s+#") {
              $line
              ($line -replace "/MP", "/FS")
              $patched = $true
            } else { $line }
          }
          Set-Content $f $out
          "options_win.cmake patched: $patched"

          $v = "tdesktop\cmake\variables.cmake"
          $lines = Get-Content $v
          $patched = $false
          $prevReplaced = $false
          $out = foreach ($line in $lines) {
            if ($line -match "CONFIG:Debug.*ProgramDatabase") {
              $patched = $true; $prevReplaced = $true
              '    "$<$<CONFIG:Debug,RelWithDebInfo>:ProgramDatabase>$<$<CONFIG:Release,MinSizeRel>:Embedded>"'
            } elseif ($prevReplaced -and $line -match 'CACHE STRING ""') {
              $prevReplaced = $false
              '    CACHE STRING "" FORCE)'
            } else { $line }
          }
          Set-Content $v $out
          "variables.cmake patched: $patched"

      - name: Cache prepared libraries
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.BUILD_ROOT }}\ThirdParty
            ${{ env.BUILD_ROOT }}\Libraries\win64\local
            ${{ env.BUILD_ROOT }}\Libraries\win64\cache_keys
            ${{ env.BUILD_ROOT }}\Libraries\patches
          key: tbuild-libs-${{ hashFiles('tdesktop/Telegram/build/prepare/prepare.py', 'tdesktop/Telegram/build/qt_version.py') }}

      - name: Set up Python 3.11 (plugins engine)
        id: pysetup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Prepare libraries (MSYS2, jom, gyp, Qt, deps)
        shell: cmd
        run: |
          move /y "%GITHUB_WORKSPACE%\tdesktop" "%BUILD_ROOT%\tdesktop"
          cd /d "%BUILD_ROOT%\tdesktop"
          python Telegram\build\prepare\prepare.py silent
        env:
          PYTHONUTF8: '1'

      - name: Configure
        shell: cmd
        run: |
          cd /d "%BUILD_ROOT%\tdesktop\Telegram"
          call configure.bat x64 -D TDESKTOP_API_ID=2040 -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627

      - name: Build AyuGram (Release)
        shell: cmd
        run: |
          cd /d "%BUILD_ROOT%\tdesktop"
          cmake --build out --config Release --target Telegram -- -m:4 > "%BUILD_ROOT%\build_log.txt" 2>&1
          type "%BUILD_ROOT%\build_log.txt"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ env.BUILD_ROOT }}\build_log.txt
          retention-days: 7
          if-no-files-found: ignore

      - name: Package
        shell: pwsh
        run: |
          $root = "$env:BUILD_ROOT\tdesktop\out"
          "=== out dir top level ==="
          if (Test-Path $root) {
            Get-ChildItem $root | ForEach-Object { $_.Name }
          } else {
            "out dir missing: $root"
            "=== tdesktop top-level dirs ==="
            Get-ChildItem "$env:BUILD_ROOT\tdesktop" -Directory | ForEach-Object { $_.Name }
          }
          "=== exe files under out ==="
          $exes = @(Get-ChildItem $root -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue)
          $exes | ForEach-Object { $_.FullName }
          if (-not $exes) { throw "no exe produced" }

          $main = @($exes | Where-Object { $_.Name -imatch "AyuGram|Telegram" })[0]
          $out = $main.DirectoryName
          "=== packaging from: $out ==="
          Get-ChildItem $out -File | ForEach-Object { $_.Name }
          $staging = "$env:BUILD_ROOT\package"
          New-Item -ItemType Directory -Force $staging | Out-Null
          Get-ChildItem $out -File |
            Where-Object { @(".pdb", ".obj", ".lib", ".exp", ".ilk", ".iobj", ".ipdb") -notcontains $_.Extension } |
            Copy-Item -Destination $staging

          # Bundle the CPython 3.11 runtime for the plugins engine.
          $pyExe = Join-Path $env:pythonLocation "python.exe"
          if (-not (Test-Path $pyExe)) {
            $pyExe = (Get-Command python -ErrorAction SilentlyContinue).Source
          }
          "python exe: $pyExe"
          if (-not $pyExe) { throw "python not found" }
          $pyRoot = & $pyExe -c "import sys; print(sys.base_prefix)"
          "python root: $pyRoot"
          if (-not (Test-Path "$pyRoot\python311.dll")) {
            throw "python311.dll not found under '$pyRoot'"
          }
          Copy-Item "$pyRoot\python311.dll" $staging
          Copy-Item "$pyRoot\vcruntime140.dll" $staging -ErrorAction SilentlyContinue
          if (Test-Path "$pyRoot\Lib") {
            "zipping python stdlib..."
            & $pyExe -c "import shutil; shutil.make_archive(r'$staging\python311', 'zip', r'$pyRoot\Lib')"
          }
          "python311.zip`n.`nimport site" | Out-File "$staging\python311._pth" -Encoding ascii

          Compress-Archive -Path "$staging\*" -DestinationPath "$env:BUILD_ROOT\AyuGram-win64.zip"
          "zip size: $([math]::Round((Get-Item "$env:BUILD_ROOT\AyuGram-win64.zip").Length / 1MB)) MB"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-win64
          path: ${{ env.BUILD_ROOT }}\AyuGram-win64.zip
          retention-days: 14
